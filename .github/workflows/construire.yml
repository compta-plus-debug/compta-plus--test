# Compile et publie le site à chaque modification (quelques minutes).
# Les tests automatiques ne tournent PAS à chaque envoi : lancez-les à la main (Actions → Construire le site → Run workflow → tests = oui).
# La cible (test ou production) est déduite du NOM du dépôt : « compta-plus--test » = test, sinon production.
name: Construire le site

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tests:
        description: "Lancer aussi les tests automatiques (lent, environ 40 min)"
        type: boolean
        default: false

permissions:
  contents: write

# Un nouvel envoi annule la construction en cours : on ne fait pas attendre pour rien.
concurrency:
  group: construire-le-site
  cancel-in-progress: true

jobs:
  publier:
    name: Compiler et publier
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer le compilateur
        run: npm install --no-audit --no-fund --no-package-lock

      # Générateur de styles Tailwind (version fixée) : produit docs/tailwind.css. Empreinte vérifiée.
      - name: Installer le générateur de styles (Tailwind 3.4.17)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/tailwindcss" "https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64"
          echo "7d24f7fa191d2193b78cd5f5a42a6093e14409521908529f42d80b11fde1f1d4  $RUNNER_TEMP/tailwindcss" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/tailwindcss"
          echo "TAILWIND_BIN=$RUNNER_TEMP/tailwindcss" >> "$GITHUB_ENV"

      - name: Compiler
        run: |
          if [[ "${GITHUB_REPOSITORY}" == *"--test" ]]; then CIBLE=test; else CIBLE=prod; fi
          echo "Cible : $CIBLE"
          if [ -f build/build.mjs ]; then S=build/build.mjs; else S=build.mjs; fi
          echo "Script : $S"
          node "$S" "$CIBLE"

      - name: Publier les fichiers compilés dans docs/
        run: |
          git config user.name "construction-automatique"
          git config user.email "actions@users.noreply.github.com"
          git add -A docs/app.min.js docs/index.html docs/tailwind.css docs/vendor docs/fonts docs/chunks
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."; exit 0
          fi
          git commit -m "Construction automatique du site"
          for essai in 1 2 3 4 5 6; do
            if git push origin HEAD:"${GITHUB_REF_NAME}"; then echo "Publié."; exit 0; fi
            echo "Envoi refusé (essai $essai), nouvelle tentative…"
            # Mettre de côté ce qui traîne, récupérer la dernière version, reposer notre commit dessus.
            git fetch origin "${GITHUB_REF_NAME}"
            git stash push --include-untracked -m "avant-publication" >/dev/null 2>&1 || true
            git rebase -X theirs "origin/${GITHUB_REF_NAME}" || git rebase --abort || true
            sleep $((essai * 5))
          done
          echo "Impossible de publier après 6 essais."; exit 1

  tests:
    name: Tests automatiques (manuel)
    if: github.event_name == 'workflow_dispatch' && inputs.tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer les dépendances
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Tests automatiques
        run: |
          if [ -f tests/tst-lancer.mjs ]; then node tests/tst-lancer.mjs
          elif [ -f tst-lancer.mjs ]; then node tst-lancer.mjs
          else echo "Tests non installés : étape ignorée."; fi
